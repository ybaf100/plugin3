# ─────────────────────────────────────────────
#  Group Survival System 설정
# ─────────────────────────────────────────────

night-vision:
  # /nv 로 영구 야간투시 켜기/끄기
  enabled: true

elytra:
  # false = 겉날개 금지 상태
  #   - 겉날개가 걸린 아이템 액자는 어떤 방법으로도 떼거나 부술 수 없음
  #   - 겉날개를 가지고 있어도 활공 불가
  # 콘솔 명령어로 변경: gss elytra on | off | status
  allowed: false

dragon:
  # 엔더드래곤 최대 체력 배율 (기본 200 x 5 = 1000)
  # spigot.yml 의 settings.attribute.maxHealth.max 보다 작아야 함
  health-multiplier: 5.0

coordinates:
  # 좌표를 숨길 월드 이름 목록. 비워두면 모든 오버월드(NORMAL) 환경 월드
  hidden-worlds: []
  # 숨김 월드에서 F3 좌표 숨김 (reducedDebugInfo)
  reduced-debug-info: true

communication:
  # 일반 플레이어가 쓸 수 있는 명령어 (gss.bypass.commands 권한은 무시)
  allowed-commands:
    - nv
    - 강화
    - upgrade
    - 체력강화
    - hp
    - 성급함강화
    - haste
  # 책과 깃펜 작성 금지
  block-books: false
  # 모루 이름 변경 금지
  block-anvil-rename: false
  # 이름표 사용 금지
  block-name-tags: false
  local-chat:
    # 채팅은 반경 안에 있는 플레이어에게만 보임
    radius: 32
    # 채팅 앞에 붙는 말머리 (& 색 코드 사용 가능)
    prefix: "[지역] "
  signs:
    # 오버월드에서 표지판을 쓸 수 있는 0,0 청크 기준 반경 (1 = 0,0 청크 + 주변 8청크 = 3x3)
    zone-radius-chunks: 1
    # 오버월드 금지 구역에서 표지판을 쓰면 바뀌는 내용 (4줄)
    replacement-overworld:
      - "표지판은"
      - "0,0 근처에서만"
      - "사용이 가능합니다"
      - ""
    # 네더/엔드에서 표지판을 쓰면 바뀌는 내용 (네더/엔드는 어디서든 불가)
    replacement-other-dimensions:
      - "표지판은"
      - "오버월드에서만"
      - "사용이 가능합니다"
      - ""

player-head:
  # 다른 플레이어에게 죽으면 그 플레이어의 머리를 떨어뜨림
  enabled: true
  # false = 바닐라처럼 "닉네임의 머리"로 보임 (닉네임이 드러남)
  # true  = 스킨만 담고 닉네임은 넣지 않음
  anonymous: false

# 데스 메시지 (모든 사망을 이 문구로 통일, & 색 코드 사용 가능)
death-message: "&c&l사람이 죽었다."

compass:
  # 오버월드에서 나침반이 항상 0,0 을 가리킴 (네더/엔드는 바닐라처럼 빙글빙글)
  point-to-origin: true
  # 일반 나침반을 손에 들고 F(손 바꾸기) = 현재 좌표를 채팅으로 확인 (나침반당 1회)
  # 확인한 나침반에는 아래 설명이 붙고, 다시 F 를 누르면 안내 메시지만 나옴
  # (자석석 나침반, 회복 나침반은 해당 없음)
  # 기록: logs/시스템/나침반좌표확인.log, logs/시스템/나침반좌표확인실패/통합.log, .../<플레이어>.log
  coordinate-check: true
  checked-lore: "&7좌표 확인이 완료된 나침반"
  coordinate-message: "&a%x%, %y%, %z%"
  already-checked-message: "&7이미 좌표 확인이 완료된 나침반입니다."

wool-to-banner:
  # 양털(모든 색)을 손에 들고 F = 들고 있는 양털 개수만큼 하얀 현수막으로 변환 (1:1)
  # 기록: logs/시스템/배너.log
  enabled: true

safe-zone:
  # 오버월드 0,0 청크와 주변 청크 안에서는 플레이어가 피해를 입지 않음
  # (블록 부수기/설치, 적대 몹 스폰은 허용)
  enabled: true
  radius-chunks: 1
  ender-chest:
    # 부술 수 없는 고정 엔더상자
    enabled: true
    x: 0
    z: 0
    # 비워두면 첫 실행 때 0,0 지면 위에 자동 배치하고 여기에 높이를 저장
    y:

# ─────────────────────────────────────────────
#  강화 시스템 (/강화, /체력강화, /성급함강화)
#  - 창 아랫줄에서 야간투시 / 성급함을 켜고 끌 수 있음 (둘 다 입자 없음, 죽어도 유지)
#  - 재료는 강화 창에서 "인벤토리의 재료를 직접 클릭"해야만 들어감 (자동 투입 없음)
#    좌클릭 = 그 칸 전부 (필요한 만큼만), 우클릭 = 1개
#  - 재료는 나눠서 넣을 수 있고, 넣은 재료는 돌려받을 수 없음
#  - 재료 키: 아이템 이름(Material) 또는 그룹 (#concrete = 아무 색 콘크리트)
#  - 이름을 바꾼/마법이 부여된 아이템도 인정. 셜커 상자 안의 아이템은 해당 없음
# ─────────────────────────────────────────────
health-upgrade:
  # 시작 하트 (마크 기본은 10하트)
  start-hearts: 8
  # "현재 하트" -> 다음 하트로 가는 데 필요한 재료. 마지막 단계 다음이 최대 하트 (22 -> 23)
  steps:
    "8":  { APPLE: 16 }
    "9":  { STONE: 64 }
    "10": { IRON_INGOT: 32, WHEAT: 64 }
    "11": { AMETHYST_SHARD: 64, "#concrete": 64 }
    "12": { DIAMOND: 16, EMERALD: 64 }
    "13": { QUARTZ_BLOCK: 64, BLAZE_POWDER: 16 }
    "14": { GOLDEN_APPLE: 16, WITHER_SKELETON_SKULL: 1, PUFFERFISH: 16 }
    "15": { ENDER_EYE: 32, END_CRYSTAL: 16 }
    "16": { DIAMOND: 64, HEART_OF_THE_SEA: 1 }
    "17": { DIAMOND: 64, DRAGON_HEAD: 2 }
    "18": { DIAMOND_BLOCK: 32, TOTEM_OF_UNDYING: 4 }
    "19": { DIAMOND_BLOCK: 64, BEACON: 1 }
    "20": { NETHER_WART: 192, GOLDEN_CARROT: 640 }
    "21": { DRAGON_BREATH: 64, TRIDENT: 2 }
    "22": { DIAMOND_BLOCK: 192, CONDUIT: 1, SPONGE: 16 }
  # 도전과제 조건 (재료는 미리 넣을 수 있지만, 조건을 채워야 강화 버튼이 눌림)
  #   "현재 하트": 숫자        = 전체 도전과제 중 그 개수 이상 달성 (레시피 해금 제외, 26.3 기준 126개)
  #   "현재 하트": [키, 키 ...] = 목록의 도전과제를 모두 달성
  advancements:
    "10": 15    # 10 -> 11하트 (기본 체력 10하트를 넘어설 때)
    "15": 40    # 15 -> 16하트
    "20": 70    # 20 -> 21하트
    "22": 100   # 22 -> 23하트 (최대)

haste-upgrade:
  # 성급함 레벨 0(해금 안 함) -> I -> II. 죽어도 다시 지급되는 영구 효과, 창에서 켜고 끌 수 있음
  steps:
    "0":
      IRON_INGOT: 64
      GOLD_INGOT: 64
      DIAMOND: 64
      LAPIS_LAZULI: 64
      REDSTONE: 64
      COAL: 64
      COPPER_INGOT: 64
      AMETHYST_SHARD: 64
    "1": { RECOVERY_COMPASS: 1, LODESTONE: 1, DRAGON_HEAD: 1 }
  # 도전과제 조건: 광질 관련 도전과제를 모두 달성해야 함 (형식은 health-upgrade.advancements 와 같음)
  advancements:
    "0":                                  # 성급함 해금
      - minecraft:story/mine_stone        # 석기 시대 (돌 캐기)
      - minecraft:story/upgrade_tools     # 더 좋은 도구로 (돌 곡괭이)
      - minecraft:story/smelt_iron        # 철 제련
      - minecraft:story/iron_tools        # 철 곡괭이
      - minecraft:story/mine_diamond      # 다이아몬드!
    "1":                                  # 성급함 I -> II
      - minecraft:story/form_obsidian     # 얼음 양동이 챌린지 (흑요석)
      - minecraft:nether/obtain_ancient_debris  # 깊은 곳에 숨겨진 것 (고대 잔해)

anonymity:
  # 다른 플레이어에게 보이는 이름 (이름표는 항상 숨김)
  anonymous-name: "익명"
  # 이 거리(블록) 안에 있는 플레이어만 클라이언트에 전송됨 (스킨으로 알아볼 수 있음)
  # 이 밖의 플레이어는 탭/소셜 화면/패킷 어디에도 존재하지 않음
  visibility-range: 48
  # 서버 목록에서 인원/플레이어 목록 숨김
  hide-server-list-players: true

client-check:
  # 바닐라 + Lunar Client 만 허용
  enabled: true
  allowed-brands:
    - vanilla
  allow-lunar: true
  # 접속 후 검사까지 대기 (틱). Lunar 감지(Apollo)에 시간이 조금 걸림
  check-delay-ticks: 100
  kick-message: "이 서버는 바닐라 또는 Lunar Client 로만 접속할 수 있습니다."

lunar:
  # Apollo-Bukkit 플러그인이 있어야 동작함
  enabled: true
  # 강제로 끌 Lunar 모드 옵션 ("Mod이름.옵션" 형식, Apollo ModXxx 클래스 기준)
  disabled-options:
    - Minimap.ENABLED            # 미니맵 (좌표, 플레이어 레이더)
    - Coordinates.ENABLED        # 좌표 HUD
    - Waypoints.ENABLED          # 웨이포인트 / 사망 지점
    - LocatorBar.ENABLED         # 위치 표시줄 (플레이어 머리/이름)
    - TeamView.ENABLED           # 팀원 벽 너머 표시
    - Markers.ENABLED            # 핑 마커 (Lunar 친구와 공유 = 통신)
    - MumbleLink.ENABLED         # Mumble 위치 기반 음성
    - Waila.SHOW_BLOCK_COORDS    # 바라보는 블록 좌표
    - DirectionHud.SHOW_TEAMMATES
    - DirectionHud.SHOW_WAYPOINTS
    - DirectionHud.SHOW_EXTERNAL_MARKERS
