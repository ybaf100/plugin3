name: GroupSurvivalSystem
prefix: Group Survival System
version: '${version}'
main: dev.groupsurvival.gss.GroupSurvivalSystem
api-version: '1.21'
description: Group Survival System - 익명 그룹 서바이벌 규칙 플러그인
depend: [packetevents]
softdepend: [Apollo-Bukkit]

commands:
  인증:
    description: 첫 접속 인증 키를 입력합니다.
    usage: /인증 <키>
    aliases: [auth]
  nv:
    description: 영구 야간투시를 켜거나 끕니다.
    usage: /nv
    permission: gss.nightvision
  강화:
    description: 강화 창을 엽니다 (체력 / 성급함, 야간투시·성급함 켜기/끄기).
    usage: /강화
    aliases: [upgrade]
  체력강화:
    description: 강화 창의 체력 탭을 엽니다.
    usage: /체력강화
    aliases: [hp]
  성급함강화:
    description: 강화 창의 성급함 탭을 엽니다.
    usage: /성급함강화
    aliases: [haste]
  gss:
    description: Group Survival System 관리 명령어 (콘솔 전용)
    usage: /gss <elytra|health|haste> ...

permissions:
  gss.nightvision:
    description: /nv 사용
    default: true
  gss.bypass.commands:
    description: 명령어 제한 무시 (관리자용)
    default: op
  gss.bypass.auth:
    description: 첫 접속 인증 건너뛰기
    default: false
  gss.bypass.clientcheck:
    description: 클라이언트 검사 무시
    default: false
